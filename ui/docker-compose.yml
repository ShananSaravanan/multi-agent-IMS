services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: retail_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        networks:
            - laravel_network
        depends_on:
            - mysql

    mysql:
        image: mysql:8.0
        container_name: retail_mysql
        restart: unless-stopped
        command: --local-infile=1  # 👈 Add this line
        environment:
            MYSQL_DATABASE: retail
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3306:3306"
        networks:
            - laravel_network
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/mysql.cnf:/etc/mysql/conf.d/mysql.cnf

    nginx:
        image: nginx:latest
        container_name: retail_nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - laravel_network
        depends_on:
            - app

volumes:
    mysql_data:

networks:
    laravel_network:
        driver: bridge
